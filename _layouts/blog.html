<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Kevin Feng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../scripts/script.js"></script>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/blog.css">
  <script src="../scripts/blog-sidenotes.js" defer></script>
</head>

<body class="bg-white font-body text-black antialiased">
  <main class="mx-auto max-w-3xl px-6 py-12 sm:py-16 lg:flex lg:items-start lg:max-w-6xl lg:justify-center lg:gap-16 xl:max-w-7xl">

    <div class="min-w-0 flex-1 lg:max-w-2xl xl:max-w-7xl">
      <div class="blog-header flex items-center gap-4">
        <div class="size-12 rounded aspect-square overflow-hidden">
          <img
            src="../img/kjfeng.png"
            alt="An Asian man in a cap and glasses grinning."
            class="block h-full w-full rounded object-cover"
          />
        </div>
        <div>
          <p class="text-xl mt-2 mb-0">Kevin's Blog</p>
          <p class="text-sm font-16"><a href="../index.html#blog">Back to homepage</a></p>
        </div>
        
      </div>

      <div class="blog-reading-layout">
        <nav class="blog-toc" aria-label="Table of contents" hidden></nav>
        <article class="blog-content text-lg">
          {{ content }}
        </article>
      </div>

      <footer class="blog-footer mt-16 border-t border-black/15 pt-4 font-16">
        <p><a href="../index.html#blog">Back to homepage</a></p>
      </footer>
    </div>
  </main>
</body>
</html>
